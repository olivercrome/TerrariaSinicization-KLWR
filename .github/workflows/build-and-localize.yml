name: Build and Localize

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      config_style:
        description: '选择字体配置'
        required: true
        default: 'config-FABU.json'
        type: choice
        options:
          - config-FABU.json
          - config-ZIYONG.json

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    
    # ============================================================
    # 🔥 新增：验证所有 JSON 文件格式（失败即终止）
    # ============================================================
    - name: Validate JSON files
      shell: pwsh
      run: |
        $jsonFiles = Get-ChildItem -Path Localization -Filter *.json
        $hasError = $false
        Write-Host "📁 开始验证 Localization 目录下的 JSON 文件..."
        foreach ($file in $jsonFiles) {
          Write-Host "  🔍 检查 $($file.Name) ..."
          $result = python -m json.tool $file.FullName 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ 错误: $($file.Name) 格式无效！"
            Write-Host $result
            $hasError = $true
          } else {
            Write-Host "  ✅ $($file.Name) 格式正确"
          }
        }
        if ($hasError) {
          Write-Host "##[error]检测到 JSON 格式错误，构建终止！"
          exit 1
        }
        Write-Host "🎉 所有 JSON 文件验证通过！"
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'
    
    - name: Build XnaFontRebuilder
      run: |
        cd font_work\XnaFontRebuilder
        dotnet build -c Release
    
    - name: Generate fonts using FontXnaBuilder.ps1
      shell: pwsh
      run: |
        cd font_work
        $config = "${{ github.event.inputs.config_style }}"
        if (-not $config) { $config = "config-FABU.json" }
        Write-Host "使用配置文件: $config"
        .\FontXnaBuilder.ps1 -ConfigFile $config

    - name: 📤 Upload font intermediate files (.bmfc / .fnt / .png)
      uses: actions/upload-artifact@v7
      with:
        name: font-intermediate-files
        path: |
          font_work/*.bmfc
          font_work/*/*.fnt
          font_work/*/*.png
        if-no-files-found: warn

    - name: Build UnpackTerrariaTextAsset
      run: |
        cd UnpackTerrariaTextAsset
        dotnet build -c Release
    
    - name: Debug - Check directories and files
      run: |
        Write-Host "Current directory: $(Get-Location)"
        Write-Host "---"
        Write-Host "Root directory contents:"
        Get-ChildItem
        Write-Host "---"
        Write-Host "Resources directory:"
        if (Test-Path Resources) { Get-ChildItem Resources }
        Write-Host "---"
        Write-Host "Localization directory:"
        if (Test-Path Localization) { Get-ChildItem Localization }
        Write-Host "---"
        Write-Host "font_work directory:"
        if (Test-Path font_work) { Get-ChildItem font_work }
    
    - name: Setup absolute paths
      id: paths
      run: |
        $rootDir = Get-Location
        $bundlePath = Join-Path $rootDir "Resources\data.unity3d"
        $localizationPath = Join-Path $rootDir "Localization"
        $outputDir = Join-Path $rootDir "output"
        $outputPath = Join-Path $outputDir "data_localized.unity3d"
        $fontWorkPath = Join-Path $rootDir "font_work"
        
        Write-Host "Root directory: $rootDir"
        Write-Host "Bundle path: $bundlePath"
        Write-Host "Localization path: $localizationPath"
        Write-Host "Output directory: $outputDir"
        Write-Host "Output path: $outputPath"
        Write-Host "Font work path: $fontWorkPath"
        
        echo "ROOT_DIR=$rootDir" >> $env:GITHUB_OUTPUT
        echo "BUNDLE_PATH=$bundlePath" >> $env:GITHUB_OUTPUT
        echo "LOCALIZATION_PATH=$localizationPath" >> $env:GITHUB_OUTPUT
        echo "OUTPUT_DIR=$outputDir" >> $env:GITHUB_OUTPUT
        echo "OUTPUT_PATH=$outputPath" >> $env:GITHUB_OUTPUT
        echo "FONT_WORK_PATH=$fontWorkPath" >> $env:GITHUB_OUTPUT
    
    - name: Create output directory
      run: |
        New-Item -ItemType Directory -Force -Path "${{ steps.paths.outputs.OUTPUT_DIR }}"
    
    # ============================================================
    # 🌐 新增：抽取原版 data.unity3d 自带的原始中文 (zh-Hans) 语言文件
    #      （须在 -build 覆盖汉化前，对未修改的原版 bundle 操作）
    # ============================================================
    - name: Extract original zh-Hans language files
      run: |
        $exeDir = Join-Path "${{ steps.paths.outputs.ROOT_DIR }}" "UnpackTerrariaTextAsset\bin\Release\net8.0"
        $zhOutDir = Join-Path "${{ steps.paths.outputs.OUTPUT_DIR }}" "original-zh-Hans"
        cd $exeDir
        Write-Host "抽取原始中文 (zh-Hans)..."
        dotnet UnpackTerrariaTextAsset.dll -extractzh "${{ steps.paths.outputs.BUNDLE_PATH }}" "$zhOutDir"
        Write-Host "Contents:"
        Get-ChildItem -Recurse $zhOutDir

    # ============================================================
    # 📦 新增：把抽取到的原始中文 JSON 压缩成 zip（用于最后上传）
    # ============================================================
    - name: Package original zh-Hans into zip
      shell: pwsh
      run: |
        $zhOutDir = Join-Path "${{ steps.paths.outputs.OUTPUT_DIR }}" "original-zh-Hans"
        $zipPath = Join-Path "${{ steps.paths.outputs.OUTPUT_DIR }}" "original-zh-Hans.zip"
        if (Test-Path $zhOutDir) {
          $tempDir = Join-Path "${{ steps.paths.outputs.OUTPUT_DIR }}" "zip-content"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          Copy-Item "$zhOutDir\*" $tempDir -Recurse
          Compress-Archive -Path "$tempDir\*" -DestinationPath $zipPath -Force
          Write-Host "打包完成: $zipPath"
          Get-Item $zipPath | Select-Object Name, Length
        } else {
          Write-Host "##[warning]未找到 $zhOutDir，跳过打包"
        }
    
    - name: Localize and replace fonts
      run: |
        $exeDir = Join-Path "${{ steps.paths.outputs.ROOT_DIR }}" "UnpackTerrariaTextAsset\bin\Release\net8.0"
        cd $exeDir
        Write-Host "Working directory: $(Get-Location)"
        Write-Host "Running command..."
        dotnet UnpackTerrariaTextAsset.dll -build "${{ steps.paths.outputs.BUNDLE_PATH }}" "${{ steps.paths.outputs.LOCALIZATION_PATH }}" "${{ steps.paths.outputs.FONT_WORK_PATH }}" "${{ steps.paths.outputs.OUTPUT_PATH }}"
        Write-Host "Command completed"

    # ============================================================
    # 📤 官方 zh-Hans 更新 Localization/ 与 害人汉化/ 的 json —— 随每次打包跑一次
    #   -build 已在第0步对上面两个目录做「官方新增条目回写」(深度递归·只补不删·
    #     保留已有自制译名,只把缺失 key 用官方原文补齐),这里只是把它们 diff 提交并 push
    #     回仓库,方便你拉取后把官方新增继续制成汉化。
    #   · 只想产物不回写仓库时,删除此 step 与顶部的 contents: write 即可。
    # ============================================================
    - name: 📤 Commit & push 官方更新到 Localization / 害人汉化
      shell: pwsh
      env:
        GIT_COMMITTER_NAME: github-actions[bot]
        GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      run: |
        git add "Localization/"
        if (git diff --cached --quiet) {
          Write-Host "Localization/ 无改动(-build 未补入新条目)，跳过提交。"
          exit 0
        }
        $branch = "${{ github.ref_name }}"
        git commit -m "🧹 以官方 zh-Hans 更新 Localization 与 害人汉化(缺失 key 仅补官方原文占位,待自制)"
        git pull --rebase origin $branch 2>&1 | Out-Host
        git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:$branch"
        Write-Host "✅ 官方更新已推送回 $branch"

    - name: Debug - Check output
      run: |
        Write-Host "Current directory: $(Get-Location)"
        Write-Host "---"
        Write-Host "All directories:"
        Get-ChildItem -Directory
        Write-Host "---"
        Write-Host "Checking for output directory:"
        if (Test-Path output) {
          Write-Host "output directory exists"
          Write-Host "Contents of output:"
          Get-ChildItem -Recurse output
        } else {
          Write-Host "output directory does NOT exist"
        }
        Write-Host "---"
        Write-Host "Checking all directories for data_localized.unity3d:"
        Get-ChildItem -Recurse -Filter "*.unity3d" -ErrorAction SilentlyContinue
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: localized-data-unity3d
        path: ${{ steps.paths.outputs.OUTPUT_PATH }}
        if-no-files-found: error

    - name: 📦 Upload original zh-Hans zip
      uses: actions/upload-artifact@v7
      with:
        name: original-zh-Hans-json
        path: ${{ steps.paths.outputs.OUTPUT_DIR }}/original-zh-Hans.zip
        if-no-files-found: warn

    - name: 📊 Upload diff-sync report (人工校对 Markdown 差分清单)
      uses: actions/upload-artifact@v7
      with:
        name: diff-sync-report
        path: ${{ steps.paths.outputs.OUTPUT_DIR }}/diff-sync-report/diff-sync-report.md
        if-no-files-found: warn